name: 功能建议
description: 提出新功能或改进
title: '[feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景，而不是直接给实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 涉及范围
      options:
        - label: 规则引擎 / 规则 schema
        - label: UI / 交互
        - label: 数据与存储
        - label: 构建 / CI / 文档
