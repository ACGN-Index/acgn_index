name: acgn_index
description: "基于自定义规则的番剧、漫画、小说采集与阅读客户端。"
publish_to: 'none'
homepage: https://github.com/ACGN-Index/ACGN-Index
repository: https://github.com/ACGN-Index/ACGN-Index
issue_tracker: https://github.com/ACGN-Index/ACGN-Index/issues

version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image_ce: ^4.13.2
  cookie_jar: ^4.0.9
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_js: ^0.8.7
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  html: ^0.15.7
  logging: ^1.3.0
  shared_preferences: ^2.5.6
  xml: ^7.1.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/rules/

